  <text x="152" y="180" fill="#b6c3d8" font-family="Arial, sans-serif" font-size="24">Intensity. Recovery. Repeat.</text>
  <rect x="150" y="230" width="320" height="98" rx="28" fill="#1d2b44" stroke="#375072" />
